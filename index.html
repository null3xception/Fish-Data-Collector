<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3a3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/montserrat-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tailwind.css">
<title>Fish Data Collector</title>
<style>html{background:#eef3f2}[x-cloak]{display:none !important}</style>
<script defer src="app.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</head>
<body class="bg-mist text-ink h-full m-0 font-sans" x-data="fishApp">

<!-- Loading skeleton: plain HTML so it shows before scripts run; fades out once the fish are loaded -->
<div class="boot fixed inset-0 z-40 flex flex-col bg-mist" :class="ready && 'boot-done'" aria-hidden="true">
  <div class="bg-lagoon flex items-center gap-2.5 px-3 sm:px-5 py-2.5 min-h-[68px]">
    <span class="hidden sm:grid place-items-center w-10 h-10 rounded-xl bg-coral-bright text-white shrink-0">
      <svg class="icon w-6 h-6" viewBox="0 0 24 24"><path d="M2 16s9-15 20-4C11 23 2 8 2 8"/></svg>
    </span>
    <div class="flex-1 min-w-0">
      <div class="text-lg font-semibold text-white leading-tight truncate">Fish Data Collector</div>
      <div class="sk-dark hidden sm:block h-3 w-24 rounded mt-1.5"></div>
    </div>
    <div class="sk-dark h-11 w-[88px] rounded-xl"></div>
    <div class="sk-dark h-11 w-11 lg:w-[150px] rounded-xl"></div>
    <div class="sk-dark h-12 w-12 sm:w-[124px] rounded-xl"></div>
  </div>
  <div class="flex-1 min-h-0 grid md:grid-cols-[minmax(300px,30%)_1fr]">
    <div class="p-4 md:border-r border-line overflow-hidden">
      <div class="h-11 rounded-xl bg-white border border-line mb-4"></div>
      <div class="flex gap-3.5 items-center rounded-2xl p-2.5 mb-2.5 bg-white shadow-card"><div class="sk w-[76px] h-[76px] rounded-xl shrink-0"></div><div class="flex-1"><div class="sk h-4 w-3/5 rounded"></div><div class="sk h-3 w-4/5 rounded mt-2"></div><div class="sk h-5 w-2/5 rounded-md mt-2.5"></div></div></div>
      <div class="flex gap-3.5 items-center rounded-2xl p-2.5 mb-2.5 bg-white shadow-card"><div class="sk w-[76px] h-[76px] rounded-xl shrink-0"></div><div class="flex-1"><div class="sk h-4 w-1/2 rounded"></div><div class="sk h-3 w-3/5 rounded mt-2"></div><div class="sk h-5 w-2/5 rounded-md mt-2.5"></div></div></div>
      <div class="flex gap-3.5 items-center rounded-2xl p-2.5 mb-2.5 bg-white shadow-card"><div class="sk w-[76px] h-[76px] rounded-xl shrink-0"></div><div class="flex-1"><div class="sk h-4 w-2/3 rounded"></div><div class="sk h-3 w-1/2 rounded mt-2"></div><div class="sk h-5 w-2/5 rounded-md mt-2.5"></div></div></div>
      <div class="flex gap-3.5 items-center rounded-2xl p-2.5 mb-2.5 bg-white shadow-card opacity-70"><div class="sk w-[76px] h-[76px] rounded-xl shrink-0"></div><div class="flex-1"><div class="sk h-4 w-2/5 rounded"></div><div class="sk h-3 w-3/5 rounded mt-2"></div><div class="sk h-5 w-2/5 rounded-md mt-2.5"></div></div></div>
      <div class="flex gap-3.5 items-center rounded-2xl p-2.5 mb-2.5 bg-white shadow-card opacity-40"><div class="sk w-[76px] h-[76px] rounded-xl shrink-0"></div><div class="flex-1"><div class="sk h-4 w-1/2 rounded"></div><div class="sk h-3 w-2/3 rounded mt-2"></div><div class="sk h-5 w-2/5 rounded-md mt-2.5"></div></div></div>
    </div>
    <div class="hidden md:flex flex-col bg-white overflow-hidden">
      <div class="flex-1 w-full max-w-6xl mx-auto px-8 pt-6 pb-6 flex flex-col">
        <div class="sk h-7 w-40 rounded-lg mb-6"></div>
        <div class="flex-1 grid gap-x-8 xl:gap-x-10 gap-y-7 lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] xl:grid-cols-2">
          <div class="flex flex-col">
            <div class="sk h-4 w-20 rounded mb-2"></div><div class="sk h-3 w-52 rounded mb-4"></div>
            <div class="grid grid-cols-2 gap-3 mb-3"><div class="sk h-12 rounded-xl"></div><div class="h-12 rounded-xl border border-line"></div></div>
            <div class="grid grid-cols-4 lg:grid-cols-2 gap-3"><div class="sk aspect-[4/3] rounded-xl"></div><div class="sk aspect-[4/3] rounded-xl"></div><div class="sk aspect-[4/3] rounded-xl opacity-60"></div><div class="sk aspect-[4/3] rounded-xl opacity-40"></div></div>
          </div>
          <div class="flex flex-col gap-6">
            <div><div class="sk h-4 w-28 rounded mb-3"></div><div class="grid sm:grid-cols-2 gap-3"><div><div class="sk h-3 w-28 rounded mb-2"></div><div class="h-11 rounded-xl border border-line"></div></div><div><div class="sk h-3 w-24 rounded mb-2"></div><div class="h-11 rounded-xl border border-line"></div></div></div></div>
            <div><div class="sk h-4 w-32 rounded mb-3"></div><div class="grid grid-cols-[1fr_1fr_minmax(0,1.3fr)] gap-3"><div><div class="sk h-3 w-20 rounded mb-2"></div><div class="h-11 rounded-xl border border-line"></div></div><div><div class="sk h-3 w-20 rounded mb-2"></div><div class="h-11 rounded-xl border border-line"></div></div><div><div class="sk h-3 w-10 rounded mb-2"></div><div class="h-11 rounded-xl border border-line"></div></div></div></div>
            <div><div class="sk h-4 w-28 rounded mb-3"></div><div class="grid sm:grid-cols-2 gap-3"><div><div class="sk h-3 w-24 rounded mb-2"></div><div class="h-11 rounded-xl border border-line"></div></div><div><div class="sk h-3 w-28 rounded mb-2"></div><div class="h-11 rounded-xl border border-line"></div></div><div class="sm:col-span-2"><div class="sk h-3 w-24 rounded mb-2"></div><div class="h-11 rounded-xl border border-line"></div></div></div></div>
          </div>
        </div>
      </div>
      <div class="border-t border-line shadow-bar">
        <div class="max-w-6xl mx-auto px-8 py-3 flex gap-2.5"><div class="sk h-12 w-[104px] rounded-xl"></div><div class="h-12 w-[200px] rounded-xl border border-line"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="flex flex-col h-screen" x-cloak>
  <!-- Header -->
  <header class="bg-lagoon text-white flex items-center gap-2 sm:gap-2.5 px-3 sm:px-5 py-2.5 min-h-[68px]">
    <button class="btn btn-bar btn-icon md:hidden" x-show="editing" @click="editing = false" aria-label="Back to list">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    </button>
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <span class="hidden sm:grid place-items-center w-10 h-10 rounded-xl bg-coral-bright text-white shrink-0">
        <svg class="icon w-6 h-6" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 16s9-15 20-4C11 23 2 8 2 8"/></svg>
      </span>
      <div class="min-w-0" :class="editing ? 'max-sm:hidden' : ''">
        <h1 class="text-lg font-semibold leading-tight tracking-[-0.01em] truncate m-0">Fish Data Collector</h1>
        <p class="text-[13px] leading-tight text-[#a9cfcb] tabular-nums hidden sm:block" x-text="summary"></p>
      </div>
    </div>
    <button class="btn btn-bar" title="Tablet code (must be different on every tablet)" :aria-label="'Tablet code ' + device + ', tap to change'" @click="renameDevice()">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M12 18h.01"/></svg>
      <span class="tabular-nums" x-text="device"></span>
    </button>
    <button class="btn btn-bar" :disabled="busy" @click="exportDataset()" aria-label="Export dataset">
      <svg class="icon" :class="busy && 'hidden'" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      <svg class="icon animate-spin" :class="!busy && 'hidden'" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>
      <span class="hidden lg:inline" x-text="busy ? 'Exporting…' : 'Export dataset'"></span>
    </button>
    <button class="btn btn-cta" @click="startNew()" aria-label="New fish">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span class="hidden sm:inline">New fish</span>
    </button>
  </header>

  <div class="flex-1 min-h-0 grid md:grid-cols-[minmax(300px,30%)_1fr] overflow-hidden">
    <!-- List pane -->
    <section x-ref="listPane" class="overflow-auto p-4 md:border-r border-line flex flex-col" :class="editing ? 'hidden md:flex' : ''">
      <div class="relative mb-4">
        <svg class="icon absolute left-3.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" class="field pl-11" placeholder="Search species or notes…" aria-label="Search fish" x-model="search">
      </div>
      <template x-for="(f, i) in filtered" :key="f.uid">
        <button type="button"
                class="card-in w-full text-left flex gap-3.5 items-center rounded-2xl p-2.5 pr-4 mb-2.5 shadow-card ring-2 ring-inset transition duration-150 hover:shadow-lift active:scale-[0.99]"
                :class="[cur && cur.uid === f.uid ? 'bg-brand-faint ring-brand' : 'bg-white ring-transparent', savedUid === f.uid && 'just-saved']"
                :style="'--i:' + Math.min(i, 8)"
                @click="open(f)">
          <template x-if="f.photos[0]">
            <img class="w-[76px] h-[76px] object-cover rounded-xl bg-line shrink-0" :src="url(f.photos[0].blob)" alt="">
          </template>
          <template x-if="!f.photos[0]">
            <span class="grid place-items-center w-[76px] h-[76px] rounded-xl bg-mist text-muted shrink-0">
              <svg class="icon w-7 h-7" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
            </span>
          </template>
          <span class="min-w-0 flex-1">
            <span class="block font-semibold text-ink truncate" x-text="f.species || '(no species)'"></span>
            <span class="block text-sm italic text-muted truncate" x-show="f.scientific" x-text="f.scientific"></span>
            <span class="mt-1.5 flex flex-wrap items-center gap-x-2 gap-y-1 text-[13px] text-muted tabular-nums">
              <span class="px-2 py-0.5 rounded-md bg-mist font-medium text-brand-dark" x-show="fishId(f)" x-text="fishId(f)"></span>
              <span x-text="f.photos.length + (f.photos.length === 1 ? ' photo' : ' photos') + (f.length ? ' · ' + f.length + ' cm' : '')"></span>
            </span>
          </span>
        </button>
      </template>
      <div class="card-in flex flex-col items-center text-center text-muted py-14 px-6" x-show="!filtered.length">
        <span class="grid place-items-center w-14 h-14 rounded-2xl bg-brand-soft text-brand mb-4">
          <svg class="icon w-7 h-7" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 16s9-15 20-4C11 23 2 8 2 8"/></svg>
        </span>
        <p class="max-w-[28ch]" x-text="records.length ? 'No matches.' : 'No fish yet. Tap “New fish” to start.'"></p>
      </div>
      <p class="mt-auto pt-4 text-[13px] text-muted">Everything is stored on this tablet. Use “Export dataset” to get a ZIP with images and labels for training.</p>
    </section>

    <!-- Editor pane -->
    <section x-ref="editorPane" class="overflow-auto bg-white flex flex-col" :class="editing ? '' : 'hidden md:flex'">
      <div x-ref="editor" class="flex-1 flex flex-col w-full max-w-6xl mx-auto px-5 sm:px-8 pt-5 pb-5 xl:pt-6 xl:pb-6" x-show="cur">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mb-4 xl:mb-6">
          <h2 class="text-xl font-semibold tracking-[-0.02em]" x-text="cur && cur.isNew ? 'New fish' : 'Edit fish'"></h2>
          <span class="tabular-nums text-sm font-medium text-brand-dark bg-brand-soft px-2.5 py-1 rounded-lg"
                x-show="cur && !cur.isNew && fishId(cur)" x-text="fishId(cur)"></span>
          <span class="ml-auto text-[13px] text-muted tabular-nums" x-show="cur && !cur.isNew" x-text="'Recorded ' + recordedOn(cur)"></span>
        </div>

        <div class="flex-1 grid gap-x-8 xl:gap-x-10 gap-y-7 lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] xl:grid-cols-2">
          <!-- Photos: the primary input, so it gets its own column on wide screens -->
          <div class="flex flex-col">
            <h3 class="section-title">Photos <span class="ml-1 font-medium text-muted tabular-nums" x-show="cur.photos.length" x-text="cur.photos.length"></span></h3>
            <p class="md:max-lg:hidden text-[13px] text-muted mt-1">Several angles of the same fish, each tagged with its view.</p>
            <div class="grid grid-cols-2 lg:max-xl:grid-cols-1 gap-3 mt-3 mb-3">
              <button type="button" class="btn px-3 text-sm" @click="$refs.cam.click()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>Take photo</button>
              <button type="button" class="btn btn-ghost px-3 text-sm leading-tight" @click="$refs.gal.click()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg><span class="whitespace-nowrap">Add from gallery</span></button>
            </div>
            <input x-ref="cam" type="file" accept="image/*" capture="environment" hidden
                   @change="addFiles($event.target.files); $event.target.value = ''">
            <input x-ref="gal" type="file" accept="image/*" multiple hidden
                   @change="addFiles($event.target.files); $event.target.value = ''">

            <!-- tiles wrap instead of scrolling; more than 4 photos switch to a denser grid -->
            <div class="photo-grid grid gap-3 content-start"
                 :class="[cur.photos.length > 4 && 'dense', !cur.photos.length && !adding && 'hidden']">
              <template x-for="(p, i) in (cur ? cur.photos : [])" :key="p.id">
                <div class="pop relative min-w-0">
                  <img class="w-full aspect-[4/3] object-cover rounded-xl bg-line block shadow-card" :src="url(p.blob)" alt="">
                  <button type="button" aria-label="Remove photo"
                          class="absolute top-1.5 right-1.5 grid place-items-center w-8 h-8 rounded-full bg-ink/70 text-white transition hover:bg-danger active:scale-90"
                          @click="cur.photos.splice(i, 1)">
                    <svg class="icon w-4 h-4" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                  </button>
                  <select class="field !min-h-[36px] mt-1.5 !py-0 !px-2 text-[13px]" x-model="p.view" aria-label="Photo view">
                    <option value="side">Side</option><option value="top">Top</option>
                    <option value="head">Head</option><option value="tail">Tail</option>
                    <option value="fins">Fins</option><option value="belly">Belly</option>
                    <option value="other">Other</option>
                  </select>
                </div>
              </template>
              <div class="pop min-w-0" :class="!adding && 'hidden'" role="status" aria-label="Processing photo">
                <div class="sk aspect-[4/3] rounded-xl"></div>
                <div class="sk h-9 rounded-xl mt-1.5"></div>
              </div>
            </div>
            <button type="button" @click="$refs.cam.click()"
                    class="flex-1 min-h-[132px] md:max-lg:min-h-[108px] flex flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-line bg-brand-faint px-6 text-center transition hover:border-brand/40 active:scale-[0.99]"
                    :class="(cur.photos.length || adding) && 'hidden'">
              <span class="grid place-items-center w-12 h-12 rounded-full bg-brand-soft text-brand"><svg class="icon w-6 h-6" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
              <span class="font-medium text-ink">No photos yet</span>
              <span class="text-[13px] text-muted max-w-[30ch]">Tap here or “Take photo” to capture the first angle.</span>
            </button>
          </div>

          <!-- Details: tight spacing inside a group, generous between groups -->
          <div class="flex flex-col gap-5 xl:gap-6">
            <div>
              <h3 class="section-title mb-3">Identification</h3>
              <div class="grid sm:grid-cols-2 gap-3">
                <div>
                  <label class="lbl" for="species">Species / type of fish <span class="text-coral">*</span></label>
                  <input id="species" class="field" type="text" list="speciesList" autocomplete="off"
                         placeholder="e.g. Barramundi" x-model="cur.species">
                  <datalist id="speciesList">
                    <template x-for="s in speciesOptions" :key="s"><option :value="s"></option></template>
                  </datalist>
                </div>
                <div>
                  <label class="lbl" for="scientific">Scientific name</label>
                  <input id="scientific" class="field italic" type="text" placeholder="e.g. Lates calcarifer" x-model="cur.scientific">
                </div>
              </div>
            </div>

            <div>
              <h3 class="section-title mb-3">Measurements</h3>
              <div class="grid grid-cols-[1fr_1fr_minmax(0,1.3fr)] gap-3">
                <div><label class="lbl" for="length">Length (cm)</label>
                  <input id="length" class="field" type="number" step="0.1" min="0" inputmode="decimal" x-model="cur.length"></div>
                <div><label class="lbl" for="weight">Weight (g)</label>
                  <input id="weight" class="field" type="number" step="1" min="0" inputmode="decimal" x-model="cur.weight"></div>
                <div><label class="lbl" for="sex">Sex</label>
                  <select id="sex" class="field" x-model="cur.sex">
                    <option value="">Unknown</option><option>Male</option><option>Female</option><option>Juvenile</option>
                  </select></div>
              </div>
            </div>

            <div>
              <h3 class="section-title mb-3">Appearance</h3>
              <div class="grid sm:grid-cols-2 gap-3">
                <div><label class="lbl" for="colours">Body colours</label>
                  <input id="colours" class="field" type="text" placeholder="silver, olive back, white belly" x-model="cur.colours"></div>
                <div><label class="lbl" for="markings">Markings / patterns</label>
                  <input id="markings" class="field" type="text" placeholder="spots, stripes, scale pattern" x-model="cur.markings"></div>
                <div class="sm:col-span-2"><label class="lbl" for="features">Fins, tail &amp; mouth</label>
                  <input id="features" class="field" type="text" placeholder="forked tail, large mouth, dorsal spines" x-model="cur.features"></div>
              </div>
            </div>

            <div class="flex-1 flex flex-col">
              <label class="section-title block mb-3" for="description">Description / notes</label>
              <textarea id="description" class="field flex-1 min-h-[64px] py-2.5 resize-none" rows="2" placeholder="Anything else that helps identify this fish" x-model="cur.description"></textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="sticky bottom-0 w-full bg-white/95 border-t border-line shadow-bar">
        <div class="max-w-6xl mx-auto px-5 sm:px-8 py-3 flex gap-2.5 items-center">
          <button class="btn" :disabled="adding" @click="save(false)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            Save
          </button>
          <button class="btn btn-ghost" :disabled="adding" @click="save(true)"><span class="sm:hidden">Save &amp; new</span><span class="hidden sm:inline">Save &amp; add another</span></button>
          <button class="btn btn-danger ml-auto max-lg:px-0 max-lg:w-12" :class="cur.isNew && 'hidden'" @click="remove()" aria-label="Delete fish">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            <span class="hidden lg:inline">Delete</span>
          </button>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- Toast -->
<div x-show="toastMsg" role="status" x-cloak
     x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-3"
     x-transition:leave="transition ease-in duration-150" x-transition:leave-end="opacity-0"
     class="fixed left-1/2 -translate-x-1/2 bottom-24 flex items-center gap-2.5 bg-ink text-white text-[15px] font-medium px-5 py-3 rounded-full shadow-lift z-50">
  <span class="w-2 h-2 rounded-full bg-coral-bright"></span>
  <span x-text="toastMsg"></span>
</div>
</body>
</html>
